<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon coffre secret</title>
<style>
:root{--accent:#8b5cf6;--bg:#0b0b14;--card:#161626;--card2:#1e1e34;--txt:#f1f1f8;--mut:#9a9ab8;--ok:#22c55e;--bad:#ef4444;--r:16px}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,color-mix(in srgb,var(--accent) 35%,transparent),transparent),radial-gradient(900px 500px at 100% 10%,#0ea5e922,transparent),var(--bg);color:var(--txt);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 80px}
header.hero{text-align:center;padding:36px 0 18px}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 8px;letter-spacing:-.02em}
.sub{font-size:1.15rem;color:var(--mut);margin:0}
.intro{max-width:620px;margin:16px auto 0;color:#cfcfe6;white-space:pre-wrap;line-height:1.5}
.progress{max-width:420px;margin:22px auto 0}
.progress .t{font-size:.85rem;color:var(--mut);margin-bottom:6px}
.pbar{height:10px;border-radius:99px;background:#ffffff14;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#22d3ee);transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:28px}
.card{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid #ffffff14;border-radius:var(--r);padding:20px;cursor:pointer;transition:.2s;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 30px -12px var(--accent)}
.card .ic{font-size:2.4rem}
.card.locked .ic{filter:grayscale(.6)}
.card h3{margin:0;font-size:1.15rem}
.card p{margin:0;color:var(--mut);font-size:.92rem;flex:1}
.badge{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:99px;background:#ffffff12;color:#c9c9e6;width:fit-content}
.state{position:absolute;top:14px;right:16px;font-size:1.3rem}
.card.done{border-color:#22c55e66}
.card .cta{margin-top:6px;padding:10px;border-radius:10px;background:var(--accent);font-weight:600;text-align:center}
.card.done .cta{background:#22c55e22;color:#86efac}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tools button,.btn.s{padding:6px 10px;border-radius:8px;background:#ffffff14;font-size:.85rem}
.tools button:hover,.btn.s:hover{background:#ffffff26}
footer{text-align:center;color:var(--mut);margin-top:50px;font-size:.9rem;white-space:pre-wrap}
.btn{padding:11px 18px;border-radius:12px;background:var(--accent);font-weight:600}
.btn:hover{filter:brightness(1.15)}
.btn.g{background:#ffffff16}
.btn.d{background:#ef444433;color:#fca5a5}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.adminbar{position:sticky;top:0;z-index:50;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px;background:#000000cc;backdrop-filter:blur(10px);border-bottom:1px solid var(--accent)}
.adminbar b{color:var(--accent);margin-right:6px}
.corner{position:fixed;right:10px;bottom:10px;opacity:.25;background:#ffffff14;border-radius:99px;padding:8px 10px}
.corner:hover{opacity:1}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:#000000b8;backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.mbox{background:var(--card);border:1px solid #ffffff1c;border-radius:20px;padding:22px;width:100%;max-width:520px;margin:auto;animation:pop .25s}
.mbox.wide{max-width:680px}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{margin:0 0 14px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld span{font-size:.85rem;color:#c9c9e6;font-weight:600}
.fld small,.hint{color:var(--mut);font-size:.8rem}
.hint{margin-bottom:10px;padding:8px 10px;background:#ffffff0c;border-radius:8px}
input,textarea,select{font:inherit;color:var(--txt);background:#0d0d1a;border:1px solid #ffffff22;border-radius:10px;padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
input[type=color]{padding:2px;height:42px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sec{margin:18px 0 8px;padding-top:12px;border-top:1px solid #ffffff14;font-weight:700}
.prev{max-width:100%;max-height:200px;border-radius:10px;display:block;margin:6px 0}
.reward{text-align:center}
.reward .txt{white-space:pre-wrap;font-size:1.1rem;line-height:1.55;margin:14px 0}
.reward img{max-width:100%;max-height:60vh;border-radius:14px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000;border:1px solid var(--accent);padding:10px 18px;border-radius:99px;z-index:300;animation:pop .2s}
/* game */
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:1.1rem}
.x{background:#ffffff14;border-radius:8px;padding:4px 10px}
.stage{position:relative;min-height:260px}
.ov{position:absolute;inset:-6px;background:#0b0b14ee;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;animation:pop .3s;text-align:center}
.ov .big{font-size:2rem;font-weight:800}
.muted{color:var(--mut);font-size:.9rem}
.fb{min-height:24px;margin:8px 0}
.inpr{display:flex;gap:8px}
.tile{display:inline-flex;width:38px;height:38px;align-items:center;justify-content:center;border-radius:8px;font-weight:800;margin:2px;background:#ffffff14;text-transform:uppercase}
.tile.g{background:#16a34a}.tile.y{background:#ca8a04}
.mem{display:grid;gap:8px;margin-top:10px}
.mc{aspect-ratio:1;font-size:1.8rem;border-radius:12px;background:linear-gradient(135deg,var(--accent),#22d3ee55);transition:.3s;transform-style:preserve-3d}
.mc span{opacity:0;transition:.2s}
.mc.up{background:#fff2}.mc.up span{opacity:1}
.mc.ok{background:#22c55e44;pointer-events:none}.mc.ok span{opacity:1}
.tbar{height:8px;border-radius:9px;background:#ffffff14;overflow:hidden}.tbar i{display:block;height:100%;background:var(--accent);width:100%}
.arena2{position:relative;height:320px;background:#0d0d1a;border-radius:14px;overflow:hidden;touch-action:none}
.tgt{position:absolute;width:58px;height:58px;font-size:1.8rem;border-radius:50%;background:radial-gradient(#fff3,#ef444488);animation:pop .15s;touch-action:none}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:280px;margin:14px auto}
.pad{aspect-ratio:1;border-radius:18px;opacity:.45;transition:.1s}.pad.on{opacity:1;transform:scale(1.05);box-shadow:0 0 30px currentColor}
canvas.cv{width:100%;border-radius:14px;background:#0d0d1a;touch-action:none;display:block;cursor:none}
/* battle */
.arena{display:grid;gap:8px;padding:12px;border-radius:14px;background:linear-gradient(#1b1b33,#10101e);position:relative}
.fighter{position:relative;width:58%;padding:8px 10px;background:#0006;border-radius:12px}
.fighter.e{margin-left:auto}
.fname{font-weight:700;display:flex;justify-content:space-between;font-size:.95rem}
.hpn{font-weight:400;color:var(--mut);font-size:.8rem}
.bar{height:9px;border-radius:9px;background:#ffffff18;margin:5px 0;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#84cc16);transition:width .5s}
.fighter.e .bar i{background:linear-gradient(90deg,#ef4444,#f97316)}
.sprite{font-size:3.4rem;text-align:center;line-height:1.1}
.sprite.hit{animation:shake .4s}.sprite.rage{animation:rage .8s}.sprite.atk{animation:lunge .4s}.sprite.dodge{animation:dodge .5s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes rage{50%{transform:scale(1.4);filter:hue-rotate(-40deg) saturate(3)}}
@keyframes lunge{50%{transform:translateY(16px) scale(1.2)}}
@keyframes dodge{50%{transform:translateX(-40px) rotate(-20deg);opacity:.4}}
.pop{position:absolute;right:14px;top:6px;font-weight:800;font-size:1.4rem;animation:up .9s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-34px);opacity:0}}
.alert{height:56px;display:flex;align-items:center;justify-content:center;border-radius:12px;margin:8px 0;font-weight:800;text-align:center;background:#ffffff0a;color:var(--mut)}
.alert.warn{background:#ca8a0433;color:#fde047}
.alert.now{background:#ef4444;color:#fff;font-size:1.4rem;animation:pulse .25s infinite alternate}
@keyframes pulse{to{transform:scale(1.04)}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{padding:12px 8px;border-radius:12px;background:#ffffff14;font-weight:600;font-size:.9rem}
.acts button:hover:not(:disabled){background:var(--accent)}
.acts button:disabled{opacity:.35}
.dodgebtn{width:100%;margin-top:8px;padding:16px;border-radius:14px;background:linear-gradient(90deg,#0ea5e9,#6366f1);font-weight:800;font-size:1.05rem}
.dodgebtn:active{transform:scale(.97)}
.log{min-height:44px;text-align:center;margin:8px 0;color:#e6e6ff}
.ebar{height:6px}.ebar i{background:linear-gradient(90deg,#eab308,#fde047)}
</style>
</head>

  const cols=Math.min(4,Math.ceil(Math.sqrt(full.length)))+(full.length>12?1:0);const grid=h('div',{class:'mem',style:`grid-template-columns:repeat(${cols},1fr)`});let first=null,lock=false,found=0,iv;

function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{if(file.type==='image/gif'&&file.size<3e6)return res(fr.result);const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.src=fr.result};fr.readAsDataURL(file)})}

 const pf=h('div');const draw=()=>{const G=GAMES[w.game];w.params={...G.defaults,...w.params};pf.replaceChildren(h('div',{class:'hint'},G.help),...G.fields.map(f=>fieldEl(f,w.params)))};
 const sel=h('select',{},Object.entries(GAMES).map(([k,g])=>h('option',{value:k},`${g.icon} ${g.label}`)));sel.value=w.game;sel.onchange=()=>{w.game=sel.value;w.params={};draw()};
 const prev=h('div'),showPrev=()=>prev.replaceChildren(...(w.reward.image?[h('img',{class:'prev',src:w.reward.image}),h('button',{class:'btn s',onclick:()=>{w.reward.image='';showPrev()}},'Retirer l\'image')]:[]));showPrev();
 const fi=h('input',{type:'file',accept:'image/*'});fi.onchange=async()=>{if(fi.files[0]){try{w.reward.image=await compress(fi.files[0]);showPrev()}catch(e){toast('Image illisible')}}};
 draw();let m;m=openModal(h('div',{},h('h2',{},isNew?'➕ Nouveau défi':'✏️ Modifier le défi'),
  fieldEl({k:'name',l:'Nom du défi'},w),fieldEl({k:'icon',l:'Icône (emoji)'},w),fieldEl({k:'desc',l:'Description affichée sur la carte',t:'textarea'},w),
  h('div',{class:'sec'},'🎮 Mini-jeu'),h('label',{class:'fld'},h('span',{},'Type de mini-jeu'),sel),pf,
  h('div',{class:'sec'},'🎁 Récompense (débloquée en cas de victoire)'),fieldEl({k:'text',l:'Texte secret',t:'textarea'},w.reward),h('div',{class:'fld'},h('span',{},'Image secrète'),fi,prev),fieldEl({k:'link',l:'Lien (optionnel)'},w.reward),fieldEl({k:'linkLabel',l:'Texte du bouton du lien'},w.reward),
  h('div',{class:'row'},h('button',{class:'btn',onclick:()=>{if(isNew)DATA.challenges.push(w);else DATA.challenges[idx]=w;saveDraft();render();m.close()}},'💾 Enregistrer'),h('button',{class:'btn g',onclick:()=>runGame(w,{test:true})},'▶ Tester'),h('button',{class:'btn g',onclick:()=>m.close()},'Annuler'),isNew?null:h('button',{class:'btn d',onclick:()=>{if(confirm('Supprimer ce défi ?')){DATA.challenges.splice(idx,1);saveDraft();render();m.close()}}},'🗑 Supprimer'))),{lock:true,cls:'wide'})}

function editSite(){const s=clone(DATA.site);const col=h('input',{type:'color',value:s.accent});col.oninput=()=>s.accent=col.value;const pw=h('input',{type:'password',placeholder:'Laisser vide pour ne pas changer'});let m;
 m=openModal(h('div',{},h('h2',{},'⚙️ Réglages du site'),fieldEl({k:'title',l:'Titre'},s),fieldEl({k:'subtitle',l:'Sous-titre'},s),fieldEl({k:'intro',l:'Texte d\'intro',t:'textarea'},s),h('label',{class:'fld'},h('span',{},'Couleur principale'),col),fieldEl({k:'footer',l:'Bas de page'},s),h('label',{class:'fld'},h('span',{},'Nouveau mot de passe créateur'),pw),
  h('div',{class:'row'},h('button',{class:'btn',onclick:async()=>{DATA.site=s;if(pw.value)DATA.pwHash=await sha(pw.value);saveDraft();render();m.close()}},'💾 Enregistrer'),h('button',{class:'btn g',onclick:()=>m.close()},'Annuler'))),{lock:true})}

/* ============ Export ============ */
function build(share){if(DATA.siteId==='demo')DATA.siteId=Math.random().toString(36).slice(2,10);const d=clone(DATA);d.rev=Date.now();d.shareMode=share;if(share){d.pwHash='';d.challenges.forEach(c=>{c.rewardEnc=enc(c.reward||{});delete c.reward})}
 const json=JSON.stringify(d).replace(/</g,'\\u003c');let html=SRC.replace(/(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);html=html.replace(/<title>[\s\S]*?<\/title>/,()=>'<title>'+esc(DATA.site.title)+'</title>');return{html,rev:d.rev}}
function dl(name,text){const a=h('a',{href:URL.createObjectURL(new Blob([text],{type:'text/html'})),download:name});document.body.append(a);a.click();a.remove()}
function exportDialog(){let m;const go=share=>{const{html,rev}=build(share);dl(share?'site-a-partager.html':'site-editable.html',html);DATA.rev=rev;saveDraft();toast(`Téléchargé (${Math.round(html.length/1024)} Ko)`)};
 m=openModal(h('div',{},h('h2',{},'📤 Exporter'),h('div',{class:'hint'},'Tu as 2 fichiers différents. Garde toujours l\'éditable, et envoie seulement l\'autre.'),
  h('div',{class:'sec'},'🌍 Version à partager'),h('p',{class:'muted'},'Pour les autres. Aucun mode créateur, pas de mot de passe dedans, récompenses brouillées. Envoie ce fichier (ou héberge-le : Netlify Drop, GitHub Pages…).'),h('button',{class:'btn',onclick:()=>go(true)},'⬇️ Télécharger site-a-partager.html'),
  h('div',{class:'sec'},'🔧 Sauvegarde éditable'),h('p',{class:'muted'},'Pour toi. À rouvrir plus tard pour continuer à modifier (bouton 🔧 + ton mot de passe).'),h('button',{class:'btn g',onclick:()=>go(false)},'⬇️ Télécharger site-editable.html'),
  h('div',{class:'row'},h('button',{class:'btn g',onclick:()=>m.close()},'Fermer'))))}

/* ============ Démarrage ============ */
try{if(!DATA.shareMode&&sessionStorage.getItem('adm:'+DATA.siteId)&&loadDraft())enterAdmin()}catch(e){}
render();
if(location.hash==='#admin'&&!DATA.shareMode&&!ADMIN)tryAdmin();
